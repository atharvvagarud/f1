# F1 Intelligence v2 — ordinary source CI (P10-2).
#
# Source-contract gates only. This workflow runs on a plain source checkout:
# it MUST NOT require the ignored runtime_artifacts bundle (see P10-1F:
# SOURCE CLONE != DEPLOYABLE RUNTIME), MUST NOT build Docker images, and
# MUST NOT invoke any scientific generation (training, ingestion, matrix /
# replay / simulation / explainability builders, 2025 evaluation).
#
# Heavy deployable validation (bundle + images + Compose smoke) is
# deliberately NOT a workflow here: no CI-accessible bundle distribution
# exists yet, and a fake workflow would be worse than none. See
# docs/PHASE10_P10_2_CONTINUOUS_INTEGRATION.md ("Heavy deployable
# validation policy").
#
# Local equivalents: `make ci-python`, `make ci-frontend`, `make ci`.

name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

# Cancel superseded runs on the same ref, but never cancel the default
# branch mid-flight to save minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/master' }}

jobs:
  python:
    name: python (3.11 source contract)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: |
            requirements.txt
            requirements-test.txt

      - name: Runtime source preflight
        run: python scripts/check_runtime_environment.py --source

      - name: Install Python dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install -r requirements-test.txt

      - name: Verify serving model SHA
        run: >
          python -c "import hashlib;
          assert hashlib.sha256(open('results/v2_model_lab/winner_logreg_raw_v1_serving.joblib','rb').read()).hexdigest()
          == '1116b34fc716035c2425e605b9a5cc15541a2d2335e26113f2e2eaf3fcaa59f4'"

      - name: Run source-safe Python tests
        run: python scripts/run_ci_tests.py

  frontend:
    name: frontend (Node 22 contract)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Run source-safe frontend tests
        run: python3 scripts/run_ci_frontend_tests.py

      - name: TypeScript
        working-directory: frontend
        run: npx tsc --noEmit -p .

      - name: ESLint
        working-directory: frontend
        run: npm run lint

      - name: Production build
        working-directory: frontend
        env:
          NEXT_PUBLIC_API_BASE: http://localhost:8000
        run: npm run build

      - name: Verify lockfile unchanged
        run: git diff --exit-code -- frontend/package-lock.json
